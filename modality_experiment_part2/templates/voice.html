<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Annotation — ATR Lab</title>
  <style>
    :root {
      --bg: #111;
      --text: #eee;
      --panel: #1a1a1a;
      --field: #262626;
      --border: #333;
      --muted: #999;
      --blue: #3b6fd4;
      --red: #d23c3c;
      --ok: #3fb950;
      --amber: #e0a100;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }

    .layout {
      display: flex;
      gap: 20px;
      padding: 20px;
      height: 100vh;
    }

    .video-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #stream {
      flex: 1;
      min-height: 0;
      width: 100%;
      object-fit: contain;
      border: 2px solid var(--border);
      border-radius: 8px;
    }

    #coordinate-limits {
      font-size: 0.85rem;
      color: var(--amber);
    }

    .side-panel {
      width: 340px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      background: var(--panel);
      border-radius: 10px;
      padding: 18px;
    }

    h2 { font-size: 1rem; margin-bottom: 8px; }

    #voice-btn {
      width: 100%;
      padding: 14px;
      color: #fff;
      background: var(--blue);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    #voice-btn.listening { background: var(--red); }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    #status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #888;
    }

    #status-dot.listening { background: var(--red); }

    #command-log {
      height: 220px;
      overflow-y: auto;
      padding: 10px;
      background: var(--field);
      border-radius: 8px;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .heard { color: var(--text); }
    .outcome { color: var(--ok); }
    .outcome.ignored { color: var(--muted); }
    .outcome.error { color: var(--red); }

    .position-fields {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .position-fields h2, .position-fields .hint, .position-fields .wide {
      grid-column: 1 / -1;
    }
    .hint { font-size: 0.75rem; color: var(--muted); }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 8px;
      color: var(--text);
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .examples {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.7;
    }

    .examples code { color: var(--text); }

    @media (max-width: 800px) {
      .layout { flex-direction: column; height: auto; }
      #stream { height: 260px; }
      .side-panel { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <main class="video-column">
      <img id="stream" alt="Live camera stream">
      <p id="coordinate-limits">Loading frame size...</p>
    </main>

    <aside class="side-panel">
      <section>
        <button id="voice-btn">Enable Voice</button>
        <div class="status">
          <span id="status-dot"></span>
          <span id="status-text">Voice off</span>
        </div>
      </section>

      <section class="position-fields">
        <h2>Where and how big</h2>
        <label>X<input type="number" id="pos-x" min="0"></label>
        <label>Y<input type="number" id="pos-y" min="0"></label>
        <label>Shape size<input type="number" id="pos-size" min="50"
          max="500"></label>
        <label class="wide">Text size<input type="number" id="pos-font-size"
          min="10" max="100"></label>
        <p class="hint">X and Y place both shapes and text. Empty = center,
          shape size 50 (50–500), text size 24 (10–100).</p>
      </section>

      <section>
        <h2>Heard</h2>
        <div id="command-log"></div>
      </section>

      <section class="examples">
        <h2>Try saying</h2>
        <code>circle</code> (or <code>draw a circle</code>)<br>
        <code>text hello world</code><br>
        <code>time</code> (toggles the clock)<br>
        <code>reset</code><br>
        Shapes: circle, square, triangle, pentagon, hexagon
      </section>
    </aside>
  </div>

  <script>
    const POLL_INTERVAL_MS = 80;
    const SEGMENT_MS = 4000;
    const FRAME_SIZE_RETRY_MS = 500;

    const stream = document.getElementById('stream');
    const voiceBtn = document.getElementById('voice-btn');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const commandLog = document.getElementById('command-log');

    let micStream = null;
    let recorder = null;
    let segmentTimer = null;
    let listening = false;

    function startVideoPolling() {
      setInterval(() => {
        stream.src = '/frame?t=' + Date.now();
      }, POLL_INTERVAL_MS);
    }

    async function loadFrameSize() {
      const label = document.getElementById('coordinate-limits');
      try {
        const response = await fetch('/frame_size');
        if (!response.ok) throw new Error('not ready');
        const size = await response.json();
        label.textContent = 'Valid coordinates: 0–' + size.width +
          ' (X) · 0–' + size.height + ' (Y)';
      } catch (err) {
        setTimeout(loadFrameSize, FRAME_SIZE_RETRY_MS);
      }
    }

    function addLogEntry(heard, outcome, kind) {
      const entry = document.createElement('div');
      const heardLine = document.createElement('div');
      heardLine.className = 'heard';
      heardLine.textContent = '🎙 ' + heard;
      const outcomeLine = document.createElement('div');
      outcomeLine.className = 'outcome ' + kind;
      outcomeLine.textContent = outcome;
      entry.append(heardLine, outcomeLine);
      commandLog.appendChild(entry);
      commandLog.scrollTop = commandLog.scrollHeight;
    }

    function setListening(isListening) {
      listening = isListening;
      voiceBtn.textContent = isListening ? 'Disable Voice' : 'Enable Voice';
      voiceBtn.classList.toggle('listening', isListening);
      statusDot.classList.toggle('listening', isListening);
      statusText.textContent = isListening ? 'Listening...' : 'Voice off';
    }

    async function sendSegment(blob) {
      const formData = new FormData();
      formData.append('audio', blob, 'segment.webm');
      formData.append('x', document.getElementById('pos-x').value);
      formData.append('y', document.getElementById('pos-y').value);
      formData.append('size', document.getElementById('pos-size').value);
      formData.append('font_size',
        document.getElementById('pos-font-size').value);
      try {
        const response = await fetch('/transcribe', {
          method: 'POST',
          body: formData,
        });
        const data = await response.json();
        if (data.error) {
          addLogEntry('(error)', data.error, 'error');
        } else if (data.transcript && data.transcript.trim()) {
          if (data.result) {
            addLogEntry(data.transcript.trim(),
              (data.ok ? '✓ ' : '✗ ') + data.result,
              data.ok ? '' : 'error');
          } else {
            addLogEntry(data.transcript.trim(),
              'Not a command — ignored', 'ignored');
          }
        }
      } catch (err) {
        addLogEntry('(network error)', err.message, 'error');
      }
    }

    // A fresh recorder per segment so every blob is a complete file.
    function recordSegment() {
      const chunks = [];
      const segmentRecorder = new MediaRecorder(micStream);
      recorder = segmentRecorder;
      segmentRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) chunks.push(event.data);
      };
      segmentRecorder.onstop = () => {
        if (chunks.length) {
          sendSegment(new Blob(chunks, { type: segmentRecorder.mimeType }));
        }
        if (listening) {
          recordSegment();
        } else {
          micStream.getTracks().forEach((track) => track.stop());
        }
      };
      segmentRecorder.start();
      segmentTimer = setTimeout(() => {
        if (segmentRecorder.state === 'recording') segmentRecorder.stop();
      }, SEGMENT_MS);
    }

    async function enableVoice() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        addLogEntry('(microphone)', err.message, 'error');
        return;
      }
      setListening(true);
      recordSegment();
    }

    function disableVoice() {
      setListening(false);
      clearTimeout(segmentTimer);
      // Stopping flushes the last segment so a half-said command still runs
      if (recorder && recorder.state === 'recording') recorder.stop();
    }

    voiceBtn.addEventListener('click', () => {
      if (listening) disableVoice(); else enableVoice();
    });

    startVideoPolling();
    loadFrameSize();
  </script>
</body>
</html>
