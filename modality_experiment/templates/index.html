<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Vision Stream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #2b1e3e;
      --surface: #1a1228;
      --accent: #4a4e8f;
      --accent-hover: #5a5eaf;
      --lavender: #a490c2;
      --silver: #e6e6fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--silver);
      font-family: 'Inter', sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      background: var(--surface);
      border-bottom: 1px solid var(--accent);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    .glow-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle, #e6e6fa 0%, var(--lavender) 55%, transparent 100%);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 4px 1px #a490c244; transform: scale(1); }
      50% { box-shadow: 0 0 14px 5px #a490c288; transform: scale(1.2); }
    }

    #clock {
      font-family: 'Orbitron', sans-serif;
      color: var(--lavender);
      font-size: 0.95rem;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .hero { text-align: center; margin-bottom: 32px; }

    .hero h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--silver);
    }

    .hero p {
      margin-top: 10px;
      color: var(--lavender);
      font-size: 1rem;
    }

    .card {
      width: 100%;
      max-width: 760px;
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .viewport {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #stream {
      display: none;
      max-width: 100%;
      max-height: 100%;
      border: 2px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 0 24px #a490c222;
    }

    #placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed var(--lavender);
      border-radius: 12px;
      color: var(--lavender);
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.05em;
    }

    .controls { display: flex; gap: 12px; }

    button {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      color: var(--silver);
      background: var(--accent);
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 12px 26px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      box-shadow: 0 0 16px #a490c255;
    }

    #stopBtn {
      display: none;
      background: transparent;
      border-color: var(--lavender);
      color: var(--lavender);
    }

    #stopBtn:hover {
      background: #a490c222;
      border-color: var(--lavender);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding-top: 16px;
      border-top: 1px solid #4a4e8f66;
      color: var(--lavender);
      font-size: 0.9rem;
    }

    #statusDot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e5484d;
    }

    #statusDot.on { background: #3fb950; }

    footer {
      text-align: center;
      padding: 18px;
      color: var(--lavender);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="glow-dot"></span>ATR Lab — Modality Experiment</div>
    <div id="clock">--:--:--</div>
  </header>

  <main>
    <section class="hero">
      <h1>Live Vision Stream</h1>
      <p>Real-time camera feed from the experiment server</p>
    </section>

    <section class="card">
      <div class="viewport">
        <img id="stream" alt="Live camera stream">
        <div id="placeholder">Stream inactive</div>
      </div>

      <div class="controls">
        <button id="watchBtn">Watch Video Stream</button>
        <button id="stopBtn">Stop Stream</button>
      </div>

      <div class="status">
        <span id="statusDot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </section>
  </main>

  <footer>HRI Class Demo · Kent State University</footer>

  <script>
    const img = document.getElementById('stream');
    const placeholder = document.getElementById('placeholder');
    const watchBtn = document.getElementById('watchBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const clock = document.getElementById('clock');

    let streamInterval = null;

    watchBtn.addEventListener('click', () => {
      placeholder.style.display = 'none';
      img.style.display = 'block';
      watchBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';
      statusDot.classList.add('on');
      statusText.textContent = 'Streaming';
      streamInterval = setInterval(() => {
        img.src = '/frame?t=' + Date.now();
      }, 80);
    });

    stopBtn.addEventListener('click', () => {
      clearInterval(streamInterval);
      streamInterval = null;
      img.style.display = 'none';
      placeholder.style.display = 'flex';
      stopBtn.style.display = 'none';
      watchBtn.style.display = 'inline-block';
      statusDot.classList.remove('on');
      statusText.textContent = 'Disconnected';
    });

    function updateClock() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      clock.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
